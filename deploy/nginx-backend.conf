# Example Nginx config for the backend VPS.
# Place at /etc/nginx/sites-available/lunch-api.conf and symlink into sites-enabled.
#
# This assumes Cloudflare is proxying api.yourcompany.com -> this server's public IP,
# and that you've obtained a TLS cert (e.g. via certbot, or Cloudflare Origin CA cert).

server {
    listen 80;
    server_name api.yourcompany.com;

    # Redirect all plain HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.yourcompany.com;

    ssl_certificate     /etc/ssl/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Restrict direct access to Cloudflare's IP ranges only, so requests must
    # go through Cloudflare's proxy/WAF and can't hit this origin directly.
    # Full current ranges: https://www.cloudflare.com/ips/
    # include /etc/nginx/cloudflare-ips.conf;
    # deny all;

    # Basic hardening
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
